<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Agent</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Travel Agent</h1>
        <p class="subtitle">Plan your trip with an AI travel assistant</p>

        <div class="form-card">

            <label>Source</label>
            <input type="text" id="source" placeholder="Example: Bengaluru">

            <label>Destination</label>
            <input type="text" id="destination" placeholder="Example: Goa">

            <label>Number of Days</label>
            <input type="number" id="days" placeholder="Example: 3">

            <label>Budget (₹)</label>
            <input type="number" id="budget" placeholder="Example: 10000">

            <label>Hotel Preference</label>
            <select id="preference">
                <option value="Budget">Budget</option>
                <option value="Standard">Standard</option>
                <option value="Luxury">Luxury</option>
            </select>

            <button onclick="createPlan()">Create Travel Plan</button>

        </div>

        <div id="result" class="result"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>
